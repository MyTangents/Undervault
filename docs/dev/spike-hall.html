<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undervault spike (throwaway)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--accent:#38e8ff}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,"Courier New",monospace;color:var(--accent)}
  #wrap{position:fixed;left:0;top:0;right:0;bottom:78px}
  #gl{width:100%;height:100%;display:block}
  #scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
  #hud{position:absolute;left:14px;top:12px;font-size:13px;line-height:1.55;text-shadow:0 0 8px currentColor;pointer-events:none}
  #hud .tag{opacity:.55;font-size:11px}
  #hints{position:absolute;left:14px;bottom:10px;font-size:11px;opacity:.6;pointer-events:none}
  #tune{position:absolute;right:12px;top:10px;font-size:11px;background:rgba(0,0,0,.55);border:1px solid var(--accent);padding:8px 10px;border-radius:4px}
  #tune label{display:grid;grid-template-columns:64px 110px;align-items:center;gap:6px;margin:3px 0}
  #tune input{accent-color:var(--accent);width:110px}
  #party{position:fixed;left:0;right:0;bottom:0;height:78px;background:#030508;border-top:1px solid var(--accent);display:grid;grid-template-columns:repeat(4,1fr);gap:0;font-size:12px}
  #party div{padding:8px 14px;border-right:1px solid rgba(255,255,255,.08);line-height:1.5}
  #party b{display:block;text-shadow:0 0 6px currentColor}
  #party span{opacity:.7}
  #enc{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #encwin{border:3px double var(--accent);padding:6px;background:#000;box-shadow:0 0 28px var(--accent)}
  #mon{height:min(62vh,560px);aspect-ratio:192/240;image-rendering:pixelated;display:block}
  #encmsg{min-height:64px;width:min(560px,92vw);font-size:14px;line-height:1.6;text-shadow:0 0 6px currentColor}
  #enchint{font-size:11px;opacity:.6}
  body.cut #wrap{animation:glitch .42s steps(2,end) forwards}
  @keyframes glitch{
    0%{filter:none;transform:none}
    20%{filter:invert(1) contrast(2);transform:translateX(-12px) skewX(4deg)}
    40%{filter:hue-rotate(120deg) brightness(2.5);transform:translateX(14px)}
    60%{filter:invert(1);transform:translateY(8px) scaleY(1.04)}
    80%{filter:brightness(4);transform:scaleX(1.06)}
    100%{filter:brightness(0);transform:scaleY(0.02)}
  }
  #enc.reveal #encwin{animation:reveal .55s ease-out}
  @keyframes reveal{from{clip-path:inset(50% 0 50% 0);filter:brightness(3)}to{clip-path:inset(0 0 0 0);filter:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
}}
</script>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="scan"></div>
  <div id="hud"><b id="area">…</b><br><span id="pos"></span><br><span class="tag">THROWAWAY SPIKE · not the game</span></div>
  <div id="hints">W/↑ forward · S/↓ back · A/D or ←/→ turn · Q/E strafe · T summon monster · H hide sliders</div>
  <div id="tune">
    <label>bloom <input id="s-bloom" type="range" min="0" max="2.5" step="0.05" value="1.05"></label>
    <label>flicker <input id="s-flick" type="range" min="0" max="2" step="0.05" value="1"></label>
    <label>lamp <input id="s-lamp" type="range" min="0" max="2" step="0.05" value="0.8"></label>
    <label>fog <input id="s-fog" type="range" min="0.03" max="0.5" step="0.01" value="0.17"></label>
    <label>scanlines <input id="s-scan" type="checkbox" checked></label>
  </div>
</div>
<div id="party"></div>
<div id="enc">
  <div id="encwin"><canvas id="mon" width="192" height="240"></canvas></div>
  <div id="encmsg"></div>
  <div id="enchint">SPACE strike · ESC flee</div>
</div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ data */
const MAP = [
"####rr#####T#####T##",
"#........#.........#",
"#........T.........#",
"#..#..#..#..#...#..r",
"T........#.........r",
"#...S....D.......M.#",
"T........#.........r",
"#..#..#..#..#...#..r",
"#........T.........#",
"#........#.........#",
"######rr#####T####T#",
];
const GRID = MAP.map(r => r.split(''));
const GW = GRID[0].length, GH = GRID.length;
MAP.forEach((r,i)=>{ if(r.length!==GW) console.warn('map row',i,'has length',r.length); });

const WALL_H = 1.15, EYE = 0.55;
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // N E S W
const SOLID = new Set(['#','r','T']);
const inB = (x,y)=> x>=0 && y>=0 && x<GW && y<GH;
const solidAt = (x,y)=> !inB(x,y) || SOLID.has(GRID[y][x]);
const walkable = (x,y)=> inB(x,y) && !SOLID.has(GRID[y][x]);
const areaOf = x => x >= 9 ? 1 : 0;

const C = h => new THREE.Color(h);
const PAL = [
  {name:'Crypt of the Gate', edge:C('#38e8ff'), wall:C('#0a2a40'), floor:C('#05121f'), ceil:C('#030b14'),
   grid:C('#1b6fa8'), door:C('#ff9a3c'), rune:C('#ff7af6'), torch:C('#7ff3ff'), fog:C('#02060a'), flick:0.22, css:'#38e8ff'},
  {name:"Sorcerer's Wing", edge:C('#f2c14e'), wall:C('#1c1036'), floor:C('#0a0618'), ceil:C('#060312'),
   grid:C('#6a3fb0'), door:C('#ff6a8a'), rune:C('#b48cff'), torch:C('#ffb347'), fog:C('#050210'), flick:0.55, css:'#f2c14e'},
];
const PARTY = [['Brannoc','Fighter',24],['Isolde','Mage',9],['Pell','Thief',14],['Orsk','Priest',17]];

/* ------------------------------------------------------------- geometry */
const lines = {p:[],c:[],u:[]}, faces = {p:[],c:[],u:[]};
const L = (a,b,col,pulse=0,k=1)=>{ lines.p.push(...a,...b); lines.c.push(col.r*k,col.g*k,col.b*k,col.r*k,col.g*k,col.b*k); lines.u.push(pulse,pulse); };
const Q = (a,b,c,d,col)=>{ faces.p.push(...a,...b,...c,...a,...c,...d); for(let i=0;i<6;i++){ faces.c.push(col.r,col.g,col.b); faces.u.push(0);} };
const add3=(a,b,s=1)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s];
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const torches = [];
function glyph(c,n,t,seed,col,pulse){
  const r=rng(seed), s=0.26;
  const P=(u,v)=>add3(add3(add3(c,n,0.015),t,u),[0,1,0],0.62+v);
  const seg=14;
  for(let i=0;i<seg;i++){ const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
    L(P(Math.cos(a0)*s,Math.sin(a0)*s),P(Math.cos(a1)*s,Math.sin(a1)*s),col,pulse); }
  L(P(0,-s*1.35),P(0,s*1.35),col,pulse);
  for(let i=0;i<4;i++){
    const a=r()*Math.PI*2, b=r()*Math.PI*2, k1=0.35+r()*0.65, k2=0.35+r()*0.65;
    L(P(Math.cos(a)*s*k1,Math.sin(a)*s*k1),P(Math.cos(b)*s*k2,Math.sin(b)*s*k2),col,pulse);
  }
  for(let i=0;i<3;i++){ const y=(r()-.5)*s*1.8; L(P(-s*1.25,y),P(-s*0.8,y),col,pulse); L(P(s*0.8,y),P(s*1.25,y),col,pulse); }
}
function ring(cx,cz,rad,seg,col,pulse,y=0.012){
  for(let i=0;i<seg;i++){ const a=i/seg*Math.PI*2,b=(i+1)/seg*Math.PI*2;
    L([cx+Math.cos(a)*rad,y,cz+Math.sin(a)*rad],[cx+Math.cos(b)*rad,y,cz+Math.sin(b)*rad],col,pulse); }
}
function sigil(cx,cz,r,col,pulse){
  ring(cx,cz,r,40,col,pulse); ring(cx,cz,r*0.72,32,col,pulse+0.2);
  for(let i=0;i<5;i++){ const a=i/5*Math.PI*2-Math.PI/2, b=((i+2)%5)/5*Math.PI*2-Math.PI/2;
    L([cx+Math.cos(a)*r*0.72,0.012,cz+Math.sin(a)*r*0.72],[cx+Math.cos(b)*r*0.72,0.012,cz+Math.sin(b)*r*0.72],col,pulse+0.2); }
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2; L([cx+Math.cos(a)*r*0.9,0.012,cz+Math.sin(a)*r*0.9],[cx+Math.cos(a)*r*1.0,0.012,cz+Math.sin(a)*r*1.0],col,pulse); }
}

for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
  const ch = GRID[y][x];
  if(SOLID.has(ch)){
    for(let d=0;d<4;d++){
      const [dx,dy]=DIRS[d], nx=x+dx, ny=y+dy;
      if(!walkable(nx,ny)) continue;
      const pal=PAL[areaOf(nx)];
      const n=[dx,0,dy], t=[-dy,0,dx], c=[x+.5+dx*.5,0,y+.5+dy*.5];
      const a=add3(c,t,-.5), b=add3(c,t,.5), cc=add3(b,[0,1,0],WALL_H), dd=add3(a,[0,1,0],WALL_H);
      Q(a,b,cc,dd,pal.wall);
      L(a,b,pal.edge); L(b,cc,pal.edge); L(cc,dd,pal.edge); L(dd,a,pal.edge);
      L(add3(a,[0,1,0],WALL_H*.5),add3(b,[0,1,0],WALL_H*.5),pal.edge,0,0.35);
      if(ch==='r') glyph(c,n,t,x*131+y*17+d,pal.rune,((x*7+y*3)%10)/10+0.1);
      if(ch==='T'){
        const up=[0,1,0], P=add3(add3(c,n,0.02),up,0.62), B=add3(add3(P,n,0.14),up,0.08);
        torches.push({n,t,P,B,area:areaOf(nx),phase:Math.random()*100,light:new THREE.Vector3(...add3(add3(B,up,0.1),n,0.1)),I:1});
      }
    }
  } else {
    const pal=PAL[areaOf(x)];
    Q([x,0,y],[x+1,0,y],[x+1,0,y+1],[x,0,y+1],pal.floor);
    Q([x,WALL_H,y],[x+1,WALL_H,y],[x+1,WALL_H,y+1],[x,WALL_H,y+1],pal.ceil);
    L([x,0,y],[x+1,0,y],pal.grid);L([x+1,0,y],[x+1,0,y+1],pal.grid);L([x+1,0,y+1],[x,0,y+1],pal.grid);L([x,0,y+1],[x,0,y],pal.grid);
    const g2=pal.grid;
    L([x,WALL_H,y],[x+1,WALL_H,y],g2,0,.4);L([x+1,WALL_H,y],[x+1,WALL_H,y+1],g2,0,.4);L([x+1,WALL_H,y+1],[x,WALL_H,y+1],g2,0,.4);L([x,WALL_H,y+1],[x,WALL_H,y],g2,0,.4);
    if(ch==='D'){
      const alongX = solidAt(x,y-1)&&solidAt(x,y+1);
      const Pt=(u,v)=> alongX ? [x+.5,v,y+u] : [x+u,v,y+.5];
      for(const [u0,rad,hp] of [[0.1,0.4,0.72],[0.17,0.33,0.72]]){
        const u1=1-u0, cu=.5;
        L(Pt(u0,0),Pt(u0,hp),pal.door); L(Pt(u1,0),Pt(u1,hp),pal.door);
        const N=12;
        for(let i=0;i<N;i++){ const a0=Math.PI-i/N*Math.PI, a1=Math.PI-(i+1)/N*Math.PI;
          L(Pt(cu+Math.cos(a0)*(cu-u0),hp+Math.sin(a0)*rad),Pt(cu+Math.cos(a1)*(cu-u0),hp+Math.sin(a1)*rad),pal.door); }
      }
      glyph(alongX?[x+.5,0,y+.5]:[x+.5,0,y+.5], alongX?[1,0,0]:[0,0,1], alongX?[0,0,1]:[1,0,0], 4242, pal.door, 0.5);
    }
  }
}
sigil(4.5,5.5,1.25,PAL[0].rune,0.1);
sigil(14.5,5.5,1.9,PAL[1].rune,0.55);

/* ------------------------------------------------------------- renderer */
const canvas=document.getElementById('gl'), wrap=document.getElementById('wrap');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color('#000');
const cam=new THREE.PerspectiveCamera(72,1,0.05,60); cam.rotation.order='YXZ';

const U = {
  uTime:{value:0}, uAmbient:{value:0.5}, uLamp:{value:0.8}, uFog:{value:0.17}, uBright:{value:1.0},
  uCam:{value:new THREE.Vector3()}, uFogCol:{value:new THREE.Color('#02060a')},
  uTorchPos:{value:Array.from({length:8},()=>new THREE.Vector3(999,999,999))},
  uTorchCol:{value:Array.from({length:8},()=>new THREE.Vector3())},
};
const VS=`attribute vec3 aCol; attribute float aPulse;
varying vec3 vCol; varying vec3 vW; varying float vD; varying float vP;
void main(){ vCol=aCol; vP=aPulse; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; vec4 mv=viewMatrix*w; vD=-mv.z; gl_Position=projectionMatrix*mv; }`;
const FS=`uniform float uTime,uAmbient,uLamp,uFog,uBright; uniform vec3 uCam,uFogCol; uniform vec3 uTorchPos[8]; uniform vec3 uTorchCol[8];
varying vec3 vCol; varying vec3 vW; varying float vD; varying float vP;
void main(){
  vec3 light=vec3(uAmbient);
  float dl=distance(vW,uCam);
  light+=vec3(1.0,0.93,0.8)*uLamp*1.5/(1.0+dl*dl*0.28);
  for(int i=0;i<8;i++){ float d=distance(vW,uTorchPos[i]); light+=uTorchCol[i]*2.2/(1.0+d*d*0.8); }
  vec3 c=vCol*light*uBright;
  if(vP>0.0) c*=0.7+0.55*sin(uTime*2.2+vP*6.2831);
  float f=clamp(1.0-exp(-uFog*vD),0.0,1.0);
  gl_FragColor=vec4(mix(c,uFogCol,f),1.0);
}`;
function mkMat(face){
  return new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,side:THREE.DoubleSide,
    polygonOffset:face,polygonOffsetFactor:face?1:0,polygonOffsetUnits:face?1:0});
}
function mkGeo(d){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(d.p,3));
  g.setAttribute('aCol',new THREE.Float32BufferAttribute(d.c,3));
  g.setAttribute('aPulse',new THREE.Float32BufferAttribute(d.u,1));
  g.computeBoundingSphere(); g.boundingSphere.radius=1e4; return g;
}
scene.add(new THREE.Mesh(mkGeo(faces),mkMat(true)));
const lineObj=new THREE.LineSegments(mkGeo(lines),mkMat(false)); lineObj.frustumCulled=false; scene.add(lineObj);

/* torches: animated vector flames */
const TV=24; // vertices per torch
for(const tr of torches){
  const g=new THREE.BufferGeometry();
  tr.pos=new Float32Array(TV*3); tr.col=new Float32Array(TV*3);
  const tc=PAL[tr.area].torch;
  const setCol=(i,k,mix)=>{ tr.col[i*3]=(tc.r*(1-mix)+mix)*k; tr.col[i*3+1]=(tc.g*(1-mix)+mix)*k; tr.col[i*3+2]=(tc.b*(1-mix)+mix)*k; };
  for(let i=0;i<6;i++) setCol(i,0.7,0);
  for(let tg=0;tg<3;tg++) for(let k=0;k<6;k++) setCol(6+tg*6+k,1.8,tg===1?0.55:0);
  // static bracket
  const up=[0,1,0], B=tr.B, arm=add3(add3(tr.P,tr.n,0.14),up,0), cupL=add3(add3(arm,tr.t,0.05),up,0.08), cupR=add3(add3(arm,tr.t,-0.05),up,0.08);
  const br=[tr.P,arm, arm,cupL, arm,cupR];
  br.forEach((p,i)=>{tr.pos.set(p,i*3);});
  tr.cupL=cupL; tr.cupR=cupR;
  g.setAttribute('position',new THREE.BufferAttribute(tr.pos,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color',new THREE.BufferAttribute(tr.col,3));
  const m=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,fog:false}));
  m.frustumCulled=false; scene.add(m); tr.obj=m;
}
function flick(t,ph){ return 0.5*Math.sin(t*7+ph)+0.3*Math.sin(t*13.3+ph*2.1)+0.2*Math.sin(t*23.7+ph*3.3); }
function updateTorches(t,amp){
  for(const tr of torches){
    const a=PAL[tr.area].flick*amp;
    const f=flick(t,tr.phase), dip=Math.sin(t*2.1+tr.phase)>0.93?-0.6*Math.min(1,amp):0;
    tr.I=Math.max(0.12,1+a*f+dip*PAL[tr.area].flick*2);
    const B=tr.B, tt=tr.t, up=[0,1,0];
    let o=6;
    for(let tg=0;tg<3;tg++){
      const lat0=(tg-1)*0.028, ht=(0.13+(tg===1?0.05:0))*(1+0.5*a*flick(t*1.3,tr.phase+tg));
      let prev=null;
      for(let k=0;k<4;k++){
        const kk=k/3, sway=Math.sin(t*9+tr.phase+tg*2+k)*0.02*(0.4+a*1.5)*kk;
        const p=add3(add3(add3(B,tt,lat0*(1-kk)+sway),up,kk*ht),tr.n,sway*0.3);
        if(prev){ tr.pos.set(prev,o*3); tr.pos.set(p,(o+1)*3); o+=2; }
        prev=p;
      }
    }
    tr.obj.geometry.attributes.position.needsUpdate=true;
  }
}

/* postprocessing */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),1.05,0.55,0.12);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false); composer.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ----------------------------------------------------------------- state */
let gx=0,gy=0,dir=1;
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++) if(GRID[y][x]==='S'){gx=x;gy=y;GRID[y][x]='.';}
let yaw=-dir*Math.PI/2;
const cur={x:gx+.5,z:gy+.5,yaw};
let anim=null, pending=null, mode='hall', areaIdx=-1;
const hudArea=document.getElementById('area'), hudPos=document.getElementById('pos');
const partyEl=document.getElementById('party');
partyEl.innerHTML=PARTY.map(p=>`<div><b>${p[0]}</b><span>${p[1]} · HP ${p[2]}/${p[2]}</span></div>`).join('');
function setArea(i){
  if(i===areaIdx) return; areaIdx=i;
  hudArea.textContent=PAL[i].name.toUpperCase();
  document.documentElement.style.setProperty('--accent',PAL[i].css);
}
function startAnim(a){ anim={...a,t0:performance.now()}; }
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tryMove(dx,dy){
  const nx=gx+dx, ny=gy+dy;
  if(walkable(nx,ny)){ const from={x:gx+.5,z:gy+.5}; gx=nx;gy=ny; startAnim({type:'move',dur:230,from,to:{x:gx+.5,z:gy+.5}}); }
  else startAnim({type:'bump',dur:170,dx,dy,base:{x:gx+.5,z:gy+.5}});
}
function cmd(c){
  if(mode!=='hall') return;
  if(anim){ pending=c; return; }
  const f=DIRS[dir], r=DIRS[(dir+1)%4], l=DIRS[(dir+3)%4];
  if(c==='fwd') tryMove(f[0],f[1]);
  else if(c==='back') tryMove(-f[0],-f[1]);
  else if(c==='sl') tryMove(l[0],l[1]);
  else if(c==='sr') tryMove(r[0],r[1]);
  else if(c==='tl'){ dir=(dir+3)%4; startAnim({type:'turn',dur:200,from:cur.yaw,to:cur.yaw+Math.PI/2}); }
  else if(c==='tr'){ dir=(dir+1)%4; startAnim({type:'turn',dur:200,from:cur.yaw,to:cur.yaw-Math.PI/2}); }
}
function stepAnim(now){
  if(!anim) return 0;
  let k=(now-anim.t0)/anim.dur, done=false; if(k>=1){k=1;done=true;}
  const e=ease(k); let bob=0;
  if(anim.type==='move'){ cur.x=anim.from.x+(anim.to.x-anim.from.x)*e; cur.z=anim.from.z+(anim.to.z-anim.from.z)*e; bob=Math.sin(k*Math.PI*2)*0.02; }
  else if(anim.type==='turn'){ cur.yaw=anim.from+(anim.to-anim.from)*e; bob=Math.sin(k*Math.PI)*0.01; }
  else { const s=Math.sin(k*Math.PI)*0.09; cur.x=anim.base.x+anim.dx*s; cur.z=anim.base.z+anim.dy*s; }
  if(done){
    const wasMove=anim.type==='move'; anim=null;
    if(wasMove) onArrive();
    if(pending && mode==='hall'){ const p=pending; pending=null; cmd(p); }
  }
  return bob;
}
function onArrive(){
  if(GRID[gy][gx]==='M') startEncounter();
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if(mode==='enc'){ if(k===' '||k==='Enter') strike(); else if(k==='Escape') endEncounter(false); return; }
  if(mode!=='hall') return;
  const map={ArrowUp:'fwd',w:'fwd',W:'fwd',ArrowDown:'back',s:'back',S:'back',ArrowLeft:'tl',a:'tl',A:'tl',ArrowRight:'tr',d:'tr',D:'tr',q:'sl',Q:'sl',e:'sr',E:'sr'};
  if(map[k]) cmd(map[k]);
  else if(k==='t'||k==='T') startEncounter();
  else if(k==='h'||k==='H'){ const t=document.getElementById('tune'); t.style.display=t.style.display==='none'?'':'none'; }
});

/* sliders */
const $=id=>document.getElementById(id);
$('s-bloom').oninput=e=>bloom.strength=+e.target.value;
$('s-lamp').oninput=e=>U.uLamp.value=+e.target.value;
$('s-fog').oninput=e=>U.uFog.value=+e.target.value;
$('s-scan').onchange=e=>$('scan').style.display=e.target.checked?'':'none';
const flickAmp=()=>+$('s-flick').value;
bloom.strength=+$('s-bloom').value; U.uLamp.value=+$('s-lamp').value;

/* ------------------------------------------------------- monster (raster) */
const MW=192, MH=240;
const monCanvas=$('mon'), mctx=monCanvas.getContext('2d',{willReadFrequently:true});
const hc=document.createElement('canvas'); hc.width=MW; hc.height=MH; const hg=hc.getContext('2d',{willReadFrequently:true});
const bc=document.createElement('canvas'); bc.width=MW; bc.height=MH; const bg=bc.getContext('2d',{willReadFrequently:true});
const ec=document.createElement('canvas'); ec.width=MW; ec.height=MH; const eg=ec.getContext('2d',{willReadFrequently:true});
function valueNoise(w,h,cell,seed){
  const r=rng(seed), gw=Math.ceil(w/cell)+2, gh=Math.ceil(h/cell)+2, lat=new Float32Array(gw*gh);
  for(let i=0;i<lat.length;i++) lat[i]=r();
  const out=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const fx=x/cell, fy=y/cell, ix=Math.floor(fx), iy=Math.floor(fy);
    let tx=fx-ix, ty=fy-iy; tx=tx*tx*(3-2*tx); ty=ty*ty*(3-2*ty);
    const a=lat[iy*gw+ix], b=lat[iy*gw+ix+1], c=lat[(iy+1)*gw+ix], d=lat[(iy+1)*gw+ix+1];
    out[y*w+x]=(a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty;
  }
  return out;
}
const grain=valueNoise(MW,MH,3,11), blotch=valueNoise(MW,MH,9,23);
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16);
const RAMP=['#06040c','#140b22','#2a1840','#4a3166','#76587f','#a68a95','#d4c0a6','#fff1cf'].map(h=>{const c=parseInt(h.slice(1),16);return[c>>16&255,c>>8&255,c&255];});
const MON={hp:3,hit:0,lunge:0,dying:0,dead:false,blinkAt:0,nextLunge:0,t0:0};
function paintHeight(g,t){
  const breath=Math.sin(t*1.5), sway=Math.sin(t*0.7)*2.5, lg=MON.lunge;
  g.fillStyle='#000'; g.fillRect(0,0,MW,MH);
  g.save(); g.translate(96+sway,8-lg*8); g.scale(1+lg*0.09,1+lg*0.09);
  // staff behind
  g.strokeStyle='#8a8a8a'; g.lineWidth=4; g.beginPath(); g.moveTo(60,62); g.lineTo(62,228); g.stroke();
  g.fillStyle='#d8d8d8'; g.beginPath(); g.ellipse(60,56,8,8,0,0,7); g.fill();
  // robe
  g.save(); g.translate(0,100); g.scale(1,1+breath*0.012); g.translate(0,-100);
  g.fillStyle='#8c8c8c'; g.beginPath(); g.moveTo(-26,92); g.bezierCurveTo(-50,130,-62,190,-72,226);
  for(let i=0;i<=10;i++){ const x=-72+i*14.4, y=232+(i%2?-12:2)+Math.sin(t*1.3+i)*3; g.lineTo(x,y); }
  g.bezierCurveTo(62,190,50,130,26,92); g.closePath(); g.fill();
  for(let i=-3;i<=3;i++){ g.strokeStyle=i%2?'#454545':'#b4b4b4'; g.lineWidth=3; g.beginPath(); g.moveTo(i*8,98);
    g.quadraticCurveTo(i*14+sway*0.5,150,i*20+Math.sin(t+i)*2,226); g.stroke(); }
  g.restore();
  // hood
  g.fillStyle='#7c7c7c'; g.beginPath(); g.moveTo(-28,98); g.bezierCurveTo(-38,50,-24,16,0,12); g.bezierCurveTo(24,16,38,50,28,98); g.closePath(); g.fill();
  g.strokeStyle='#c4c4c4'; g.lineWidth=2.5; g.beginPath(); g.moveTo(-26,92); g.bezierCurveTo(-34,50,-22,20,0,16); g.bezierCurveTo(22,20,34,50,26,92); g.stroke();
  g.fillStyle='#0b0b0b'; g.beginPath(); g.ellipse(0,62,17,23,0,0,7); g.fill();
  // skull
  g.fillStyle='#d2d2d2'; g.beginPath(); g.ellipse(0,60,10.5,14,0,0,7); g.fill();
  g.fillStyle='#b6b6b6'; g.fillRect(-6,72,12,8);
  g.fillStyle='#101010'; g.beginPath(); g.ellipse(-4.6,58,3.1,4.2,0,0,7); g.ellipse(4.6,58,3.1,4.2,0,0,7); g.fill();
  g.beginPath(); g.moveTo(0,63); g.lineTo(-1.8,68); g.lineTo(1.8,68); g.fill();
  g.strokeStyle='#222'; g.lineWidth=1; for(let i=-4;i<=4;i+=2){ g.beginPath(); g.moveTo(i,73); g.lineTo(i,79); g.stroke(); }
  // arms + hands
  const reach=lg*14;
  for(const s of [-1,1]){
    const hx=s*(50+reach*0.6), hy=150+breath*2-reach;
    g.fillStyle='#6a6a6a'; g.beginPath(); g.moveTo(s*24,98); g.lineTo(s*62,122+breath*2); g.lineTo(hx+s*4,hy-6); g.lineTo(s*34,128); g.closePath(); g.fill();
    g.strokeStyle='#dcdcdc'; g.lineWidth=2;
    for(let f=0;f<5;f++){ const a=(-0.9+f*0.45)*s+(s>0?0:0); g.beginPath(); g.moveTo(hx,hy); g.lineTo(hx+Math.sin(a)*13,hy+Math.cos(a)*13+Math.sin(t*3+f)*0.8); g.stroke(); }
    g.fillStyle='#cfcfcf'; g.beginPath(); g.ellipse(hx,hy,4,3,0,0,7); g.fill();
  }
  g.restore();
}
function paintEmissive(g,t){
  const lg=MON.lunge, sway=Math.sin(t*0.7)*2.5;
  g.clearRect(0,0,MW,MH);
  const open=(performance.now()<MON.blinkAt+140)?0.15:1;
  const glow=(x,y,r,rgb,a)=>{ const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${rgb},${a})`); gr.addColorStop(1,`rgba(${rgb},0)`); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); };
  const ox=96+sway, oy=8-lg*8, sc=1+lg*0.09;
  g.save(); g.translate(ox,oy); g.scale(sc,sc);
  g.save(); g.translate(0,58); g.scale(1,open); g.translate(0,-58);
  glow(-4.6,58,5.5,'255,60,50',1); glow(4.6,58,5.5,'255,60,50',1);
  g.restore();
  const pulse=0.75+0.25*Math.sin(t*3.1);
  glow(60,56,16,'170,120,255',pulse);
  g.restore();
}
function paintMonster(t){
  paintHeight(hg,t); paintEmissive(eg,t);
  bg.clearRect(0,0,MW,MH); bg.filter='blur(1.3px)'; bg.drawImage(hc,0,0); bg.filter='none';
  const hd=bg.getImageData(0,0,MW,MH).data, ed=eg.getImageData(0,0,MW,MH).data;
  const out=mctx.createImageData(MW,MH), od=out.data;
  const fl=0.5+0.5*flick(t,3.1), lx=-0.55+0.18*flick(t*1.4,7), ly=-0.6, lz=0.55, ll=Math.hypot(lx,ly,lz), Lx=lx/ll,Ly=ly/ll,Lz=lz/ll;
  const lightI=0.82+0.3*fl, hit=MON.hit, dy=MON.dying;
  for(let y=1;y<MH-1;y++){
    for(let x=1;x<MW-1;x++){
      const p=y*MW+x, i=p*4, h=hd[i]/255; let s, burn=0, edge=false;
      if(h<0.03){
        const m=0.5+0.5*Math.sin(x*0.045+t*0.35+Math.sin(y*0.05-t*0.22)*2.2);
        const vx=(x-96)/96, vy=(y-130)/130, vig=Math.max(0,1-(vx*vx+vy*vy)*0.7);
        s=(0.05+0.17*m*(0.35+y/MH*0.65))*vig;
      } else {
        const ddx=(hd[i+4]-hd[i-4])/255*5, ddy=(hd[i+4*MW]-hd[i-4*MW])/255*5;
        const nl=(-ddx*Lx-ddy*Ly+Lz)/Math.sqrt(ddx*ddx+ddy*ddy+1);
        s=h*0.5+Math.max(0,nl)*0.55*lightI*(0.35+h*0.65)+(grain[p]-0.5)*0.16*h;
        s*=1-Math.max(0,(y-195)/45)*0.55;
        if(dy>0){ const n=blotch[p]; if(n<dy){ const m=0.5+0.5*Math.sin(x*0.045+t*0.35+Math.sin(y*0.05-t*0.22)*2.2); s=0.04+0.12*m; } else if(n-dy<0.05){ burn=1; } }
        s+=hit*0.6;
      }
      const b=BAYER[(y&3)*4+(x&3)];
      let v=Math.min(1,Math.max(0,s))*(RAMP.length-1), i0=Math.floor(v); if(v-i0>b) i0++; i0=Math.min(RAMP.length-1,i0);
      let c=RAMP[i0];
      const ea=ed[i+3]/255;
      if(ea>0.12 && dy===0 && ea>b*0.85){ c=[ed[i],ed[i+1],ed[i+2]]; }
      if(burn) c=b>0.5?[255,210,120]:[255,110,30];
      od[i]=c[0]; od[i+1]=c[1]; od[i+2]=c[2]; od[i+3]=255;
    }
  }
  mctx.putImageData(out,0,0);
}

/* ------------------------------------------------------------ encounter */
const encEl=$('enc'), encMsg=$('encmsg'); let log=[];
function say(s){ log.push(s); if(log.length>3) log.shift(); encMsg.innerHTML=log.map((l,i)=>`<div style="opacity:${0.45+0.275*i}">${l}</div>`).join(''); }
function startEncounter(){
  if(mode!=='hall') return;
  mode='cut'; document.body.classList.add('cut');
  setTimeout(()=>{
    document.body.classList.remove('cut');
    Object.assign(MON,{hp:3,hit:0,lunge:0,dying:0,dead:false,blinkAt:0,nextLunge:performance.now()/1000+2.5});
    log=[]; encMsg.innerHTML=''; say('A hooded ASH WRAITH drifts out of the dark.');
    encEl.style.display='flex'; encEl.classList.remove('reveal'); void encEl.offsetWidth; encEl.classList.add('reveal');
    mode='enc';
  },430);
}
function strike(){
  if(MON.dead||MON.dying>0) return;
  MON.hit=1; MON.hp--; const who=PARTY[Math.floor(Math.random()*PARTY.length)][0], dmg=4+Math.floor(Math.random()*5);
  say(`${who} strikes the ASH WRAITH for ${dmg}!`);
  if(MON.hp<=0){ MON.dying=0.001; say('The ASH WRAITH comes apart in cinders.'); }
}
function endEncounter(won){
  encEl.style.display='none'; mode='hall';
  if(GRID[gy][gx]==='M') GRID[gy][gx]='.';
}
function updateEnc(now,t,dt){
  if(!updateEnc.last||now-updateEnc.last>=42){
    updateEnc.last=now;
    MON.hit=Math.max(0,MON.hit-0.09);
    if(MON.dying>0){ MON.dying+=0.018; if(MON.dying>=1.05) { MON.dead=true; MON.dying=0; endEncounter(true); return; } }
    MON.lunge=Math.max(0,MON.lunge-0.045);
    if(t>MON.nextLunge && MON.dying===0){ MON.lunge=1; MON.nextLunge=t+2.5+Math.random()*2.5; say(`The ASH WRAITH rakes at ${PARTY[Math.floor(Math.random()*4)][0]}!`); }
    if(now>MON.blinkAt+4000+Math.random()*2000) MON.blinkAt=now;
    paintMonster(t);
    const s=MON.hit>0?(Math.random()-.5)*10*MON.hit:0; monCanvas.style.transform=`translate(${s}px,${(Math.random()-.5)*s*0.6}px)`;
  }
}

/* ------------------------------------------------------------- main loop */
const tmpFog=new THREE.Color();
const order=torches.map((_,i)=>i);
let last=performance.now();
function updateHall(now,t){
  const bob=stepAnim(now);
  cam.position.set(cur.x,EYE+bob,cur.z);
  cam.rotation.set(Math.sin(t*0.9)*0.004,cur.yaw,0);
  U.uTime.value=t; U.uCam.value.copy(cam.position);
  const blend=Math.min(1,Math.max(0,(cur.x-8.4)/2.2));
  tmpFog.copy(PAL[0].fog).lerp(PAL[1].fog,blend); U.uFogCol.value.copy(tmpFog); scene.background.copy(tmpFog);
  U.uAmbient.value=0.5-0.12*blend;
  setArea(cur.x>=9.5?1:0);
  hudPos.textContent=`x ${gx}  y ${gy}  facing ${'NESW'[dir]}`;
  updateTorches(t,flickAmp());
  order.sort((a,b)=>torches[a].light.distanceToSquared(cam.position)-torches[b].light.distanceToSquared(cam.position));
  for(let i=0;i<8;i++){
    const tr=torches[order[i]]; if(!tr){ U.uTorchPos.value[i].set(999,999,999); U.uTorchCol.value[i].set(0,0,0); continue; }
    const c=PAL[tr.area].torch; U.uTorchPos.value[i].copy(tr.light);
    U.uTorchCol.value[i].set(c.r*tr.I,c.g*tr.I,c.b*tr.I);
  }
  composer.render();
}
function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000;
  if(mode==='hall'||mode==='cut') updateHall(now,t);
  else if(mode==='enc') updateEnc(now,t);
}
setArea(areaOf(gx));
requestAnimationFrame(frame);
window.__spike={torches,PAL,get mode(){return mode;},startEncounter};
</script>
